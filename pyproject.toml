[project]
name = "skill-placebo"
version = "0.1.0"
description = "Placebo-controlled benchmark of the most-starred coding agent skills"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "harbor==0.23.0"]

[project.scripts]
skill-placebo = "skill_placebo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_placebo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Only the package and what it needs to explain itself; tasks, arms and results live in the repository.
include = ["/src", "/README.md", "/LICENSE", "/METHOD.md"]
