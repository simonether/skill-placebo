[project]
name = "skill-placebo"
version = "0.1.1"
description = "Placebo-controlled benchmark of the most-starred coding agent skills"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "harbor==0.23.0"]
keywords = ["agent-skills", "claude-code", "codex", "coding-agents", "benchmark", "placebo", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/simonether/skill-placebo"
Repository = "https://github.com/simonether/skill-placebo"
Issues = "https://github.com/simonether/skill-placebo/issues"

[project.scripts]
skill-placebo = "skill_placebo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_placebo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Only the package and what it needs to explain itself; tasks, arms and results live in the repository.
include = ["/src", "/README.md", "/LICENSE", "/METHOD.md"]
