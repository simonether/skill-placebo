[project]
name = "skill-placebo"
version = "0.0.1"
description = "Placebo-controlled benchmark of the most-starred coding agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26"]

[project.scripts]
skill-placebo = "skill_placebo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_placebo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
